apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pgdata-notification
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-notification
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres-notification
  template:
    metadata:
      labels:
        app: postgres-notification
    spec:
      containers:
        - name: postgres-notification
          image: postgres:16
          env:
            - name: POSTGRES_DB
              value: notification_db
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: omnishop-config
                  key: DB_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: omnishop-secrets
                  key: DB_PASS
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: pgdata-notification
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres", "-d", "notification_db"]
            initialDelaySeconds: 10
            periodSeconds: 5
      volumes:
        - name: pgdata-notification
          persistentVolumeClaim:
            claimName: pgdata-notification
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-notification-service
spec:
  selector:
    app: postgres-notification
  ports:
    - port: 5432
      targetPort: 5432
