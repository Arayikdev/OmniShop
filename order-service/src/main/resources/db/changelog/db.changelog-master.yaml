databaseChangeLog:

  - changeSet:
      id: 1-create-cart-items-table
      author: omnishop
      changes:
        - createTable:
            tableName: cart_items
            columns:
              - column:
                  name: id
                  type: UUID
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: product_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: quantity
                  type: INT
                  constraints:
                    nullable: false
                    checkConstraint: "quantity > 0"
              - column:
                  name: added_at
                  type: TIMESTAMP
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
        - addUniqueConstraint:
            tableName: cart_items
            columnNames: user_id, product_id
            constraintName: uq_cart_user_product
        - createIndex:
            tableName: cart_items
            indexName: idx_cart_user_id
            columns:
              - column:
                  name: user_id

  - changeSet:
      id: 2-create-orders-table
      author: omnishop
      changes:
        - createTable:
            tableName: orders
            columns:
              - column:
                  name: id
                  type: UUID
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(20)
                  defaultValue: CONFIRMED
                  constraints:
                    nullable: false
              - column:
                  name: delivery_status
                  type: VARCHAR(20)
                  defaultValue: PREPARING
                  constraints:
                    nullable: false
              - column:
                  name: estimated_delivery
                  type: TIMESTAMP
              - column:
                  name: total_amount
                  type: NUMERIC(10,2)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
        - createIndex:
            tableName: orders
            indexName: idx_orders_user_id
            columns:
              - column:
                  name: user_id
        - createIndex:
            tableName: orders
            indexName: idx_orders_status
            columns:
              - column:
                  name: status
        - createIndex:
            tableName: orders
            indexName: idx_orders_created_at
            columns:
              - column:
                  name: created_at

  - changeSet:
      id: 3-create-order-items-table
      author: omnishop
      changes:
        - createTable:
            tableName: order_items
            columns:
              - column:
                  name: id
                  type: UUID
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: order_id
                  type: UUID
                  constraints:
                    nullable: false
                    foreignKeyName: fk_order_items_order_id
                    references: orders(id)
                    deleteCascade: true
              - column:
                  name: product_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: product_name
                  type: VARCHAR(255)
              - column:
                  name: quantity
                  type: INT
                  constraints:
                    nullable: false
                    checkConstraint: "quantity > 0"
              - column:
                  name: price_at_purchase
                  type: NUMERIC(10,2)
                  constraints:
                    nullable: false
        - createIndex:
            tableName: order_items
            indexName: idx_order_items_order_id
            columns:
              - column:
                  name: order_id

  - changeSet:
      id: 4-create-shedlock-table
      author: omnishop
      changes:
        - createTable:
            tableName: shedlock
            columns:
              - column:
                  name: name
                  type: VARCHAR(64)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: lock_until
                  type: TIMESTAMP(3)
                  constraints:
                    nullable: false
              - column:
                  name: locked_at
                  type: TIMESTAMP(3)
                  constraints:
                    nullable: false
              - column:
                  name: locked_by
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

  - changeSet:
      id: 5-remove-pending-status-note
      author: omnishop
      comment: "PENDING order status removed. Orders are now immediately CONFIRMED or CANCELLED. No SQL change needed — status column is VARCHAR."
      changes: []
